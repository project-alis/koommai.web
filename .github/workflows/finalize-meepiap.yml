name: Finalize MEEPIAP from main

on:
  push:
    branches: [meepiap-v1-final]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: meepiap-v1-final
          fetch-depth: 0

      - name: Fetch Discovery source branch
        run: git fetch origin meepiap-discovery-v1

      - name: Apply MEEPIAP brand and Discovery files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          # Rebrand the latest main-line content without discarding Affiliate/SEO improvements.
          replacements = [
            ('OHOPIAP', 'MEEPIAP'), ('Ohopiap', 'Meepiap'), ('ohopiap', 'meepiap'),
            ('โอ้โหเพียบ', 'มีเพียบ'), ('<span>OHO</span>PIAP', '<span>MEE</span>PIAP')
          ]
          allowed = {'.md','.txt','.html','.js','.json','.jsonc','.svg','.css','.sql','.webmanifest'}
          for p in Path('.').rglob('*'):
            if not p.is_file() or p.suffix.lower() not in allowed or '.git' in p.parts or 'node_modules' in p.parts:
              continue
            text = p.read_text(encoding='utf-8')
            new = text
            for a,b in replacements: new = new.replace(a,b)
            if new != text: p.write_text(new, encoding='utf-8')

          # Copy final Discovery/UI artifacts from the reviewed feature branch.
          files = [
            'README-DISCOVERY-V1.md',
            'examples/discovery-entities-template.sql',
            'migrations/0004_discovery_core.sql',
            'migrations/0005_discovery_search_scale.sql',
            'public/assets/discovery.js',
            'public/assets/meepiap-wow.css',
            'public/assets/meepiap-quick.css',
            'public/assets/meepiap-wow.js',
            'public/assets/favicon.svg',
            'public/index.html',
            'public/site.webmanifest',
            'wrangler.jsonc',
            '.github/workflows/ci.yml'
          ]
          for f in files:
            out = subprocess.check_output(['git','show',f'origin/meepiap-discovery-v1:{f}'])
            p = Path(f); p.parent.mkdir(parents=True, exist_ok=True); p.write_bytes(out)

          # Preserve latest main README content; just ensure package identity follows MEEPIAP.
          pkg = Path('package.json')
          text = pkg.read_text(encoding='utf-8').replace('"name": "ohopiap-web"','"name": "meepiap-web"').replace('"name": "koommai-v1-seo"','"name": "meepiap-web"')
          pkg.write_text(text, encoding='utf-8')
          PY

      - name: Validate copied files
        run: |
          node --check public/assets/discovery.js
          node --check public/assets/meepiap-wow.js
          python3 -m json.tool package.json >/dev/null
          grep -q 'MEEPIAP' public/index.html
          grep -q 'มีเพียบ' public/index.html
          grep -q 'meepiap.com' wrangler.jsonc

      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/finalize-meepiap.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build MEEPIAP final branch from latest main"
          git push origin HEAD:meepiap-v1-final
