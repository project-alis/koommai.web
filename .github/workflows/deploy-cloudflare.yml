name: Deploy MEEPIAP to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meepiap-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
          fi

      - name: Install dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: npm install

      - name: Apply D1 migrations
        if: steps.credentials.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply koommai-db --remote

      - name: Deploy Worker and Custom Domains
        if: steps.credentials.outputs.ready == 'true'
        run: npx wrangler deploy

      - name: Verify production
        if: steps.credentials.outputs.ready == 'true'
        run: |
          echo '=== https://meepiap.com ==='
          curl --fail-with-body -sSIL --retry 3 --retry-delay 2 --max-time 30 https://meepiap.com/
          echo '=== /api/health ==='
          curl --fail-with-body -sS --retry 3 --retry-delay 2 --max-time 30 https://meepiap.com/api/health
          echo
