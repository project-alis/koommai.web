name: MEEPIAP CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/meepiap-affiliate-publisher-v2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, branding and configuration
        run: npm run check
      - name: Admin, product CRUD and legacy migration regression tests
        run: npm test
