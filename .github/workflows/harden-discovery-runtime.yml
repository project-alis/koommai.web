name: Harden MEEPIAP Discovery runtime

on:
  push:
    branches:
      - meepiap-production-hardening

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: meepiap-production-hardening
      - name: Patch Worker
        run: python3 scripts/harden_discovery_runtime.py
      - name: Validate
        run: |
          node --check worker/index.js
          grep -q "ensureDiscoveryCore" worker/index.js
          grep -q "like-fallback" worker/index.js
          grep -q "discoveryCoreReady" worker/index.js
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Harden Discovery runtime before D1 migrations"
          git push origin HEAD:meepiap-production-hardening
