name: Apply MEEPIAP wow UI

on:
  push:
    branches:
      - meepiap-discovery-v1

permissions:
  contents: write

jobs:
  apply-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: meepiap-discovery-v1
          fetch-depth: 0

      - name: Wire UI assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('public/index.html')
          text = index.read_text(encoding='utf-8')
          assets = (
              '  <link rel="stylesheet" href="/assets/meepiap-wow.css">\n'
              '  <link rel="stylesheet" href="/assets/meepiap-quick.css">\n'
              '  <script src="/assets/meepiap-wow.js" defer></script>\n'
          )
          if '/assets/meepiap-wow.css' not in text:
              text = text.replace('</head>', assets + '</head>', 1)
          else:
              if '/assets/meepiap-quick.css' not in text:
                  text = text.replace('</head>', '  <link rel="stylesheet" href="/assets/meepiap-quick.css">\n</head>', 1)
              if '/assets/meepiap-wow.js' not in text:
                  text = text.replace('</head>', '  <script src="/assets/meepiap-wow.js" defer></script>\n</head>', 1)
          index.write_text(text, encoding='utf-8')
          PY

      - name: Validate UI integration
        run: |
          grep -q '/assets/meepiap-wow.css' public/index.html
          grep -q '/assets/meepiap-quick.css' public/index.html
          grep -q '/assets/meepiap-wow.js' public/index.html
          node --check public/assets/meepiap-wow.js
          node --check public/assets/discovery.js
          node --check worker/index.js

      - name: Commit UI wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then
            echo "UI already wired"
            exit 0
          fi
          git commit -m "Wire MEEPIAP wow UI assets"
          git push origin HEAD:meepiap-discovery-v1
