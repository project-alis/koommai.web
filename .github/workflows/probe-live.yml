name: Probe MEEPIAP live endpoints

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current and legacy Worker endpoints
        run: |
          set +e
          for url in \
            https://meepiap.com/ \
            https://www.meepiap.com/ \
            https://meepiap.javis-github.workers.dev/ \
            https://ohopiap.javis-github.workers.dev/ \
            https://ohopiap-web.javis-github.workers.dev/; do
            echo "=== $url ==="
            curl -sSIL --max-time 15 "$url" || true
          done
          echo '=== old worker health ==='
          curl -sS --max-time 15 -D - https://ohopiap.javis-github.workers.dev/api/health || true
